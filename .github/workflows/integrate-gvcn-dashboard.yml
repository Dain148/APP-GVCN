name: Integrate GVCN Dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject dashboard module into index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./dashboard-gvcn.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Không tìm thấy </body> trong index.html')
              text = text.replace(marker, f'    {tag}\n{marker}', 1)
              p.write_text(text, encoding='utf-8')
          else:
              print('Dashboard module đã được tích hợp.')

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Không có thay đổi cần commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate GVCN Dashboard into Tong quan'
          git push
