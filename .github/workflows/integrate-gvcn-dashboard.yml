name: Integrate GVCN Dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject dashboard modules into index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tags = [
              '<script src="./dashboard-gvcn.js"></script>',
              '<script src="./dashboard-gvcn-attendance.js"></script>',
              '<script src="./dashboard-gvcn-attention.js"></script>',
              '<script src="./dashboard-gvcn-student-detail.js"></script>',
              '<script src="./dashboard-gvcn-analysis-alert.js"></script>',
              '<script src="./student-ai-recommendation.js"></script>',
              '<script src="./student-dashboard.js"></script>',
              '<script src="./student-dashboard-integration.js"></script>',
          ]
          marker = '</body>'
          if marker not in text:
              raise SystemExit('Không tìm thấy </body> trong index.html')
          missing = [tag for tag in tags if tag not in text]
          if missing:
              text = text.replace(marker, ''.join(f'    {tag}\n' for tag in missing) + marker, 1)
              p.write_text(text, encoding='utf-8')
          else:
              print('Dashboard modules đã được tích hợp.')

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Không có thay đổi cần commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate student dashboard launcher'
          git push
