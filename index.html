<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>10A8 — GVCN Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-50 text-slate-800"><div id="app" class="max-w-7xl mx-auto p-5 md:p-8"></div>
<script>
/* GVCN DASHBOARD — 04/09
   Core: tổng HS · điểm TB · thống kê môn · danh sách · filter/sort · biểu đồ · hồ sơ HS.
   Dữ liệu ưu tiên state.students hiện có; fallback localStorage/demo để Dashboard luôn có thể chạy độc lập.
*/
const demo=[{id:1,name:'Nguyễn Văn A',group:'Tổ 1',points:85,scores:{Toán:8.5,Văn:7.5,Anh:8}},{id:2,name:'Trần Thị B',group:'Tổ 2',points:60,scores:{Toán:7.5,Văn:8.5,Anh:8}},{id:3,name:'Lê Hoàng C',group:'Tổ 3',points:45,scores:{Toán:6.5,Văn:7,Anh:7.5}}];
let students=[],q='',sort='name',picked=null;
function boot(){try{students=Array.isArray(window.state?.students)&&window.state.students.length?window.state.students:JSON.parse(localStorage.getItem('gvcn_students')||'null')||demo}catch(e){students=demo}draw()}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avg=s=>{let a=Object.values(s.scores||{}).map(Number).filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
function subjectStats(){let m={};students.forEach(s=>Object.entries(s.scores||{}).forEach(([k,v])=>{v=Number(v);if(Number.isFinite(v)){m[k]??=[];m[k].push(v)}}));return Object.entries(m).map(([name,a])=>({name,avg:a.reduce((x,y)=>x+y,0)/a.length})).sort((a,b)=>b.avg-a.avg)}
function filtered(){return [...students].filter(s=>(s.name||'').toLowerCase().includes(q.toLowerCase())||(s.group||'').toLowerCase().includes(q.toLowerCase())).sort((a,b)=>sort==='avg'?(avg(b)||0)-(avg(a)||0):sort==='points'?(b.points||0)-(a.points||0):(a.name||'').localeCompare(b.name||'','vi'))}
function classAvg(){let a=students.map(avg).filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function card(icon,label,value,cls){return `<div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm"><div class="w-11 h-11 rounded-xl bg-${cls}-50 text-${cls}-600 flex items-center justify-center mb-4"><i class="ph-fill ${icon} text-2xl"></i></div><div class="text-3xl font-black">${value}</div><div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">${label}</div></div>`}
function draw(){let subs=subjectStats(),rows=filtered();document.getElementById('app').innerHTML=`
<header class="flex flex-col md:flex-row md:justify-between md:items-end gap-4 mb-7"><div><div class="text-xs font-bold tracking-[.2em] text-indigo-600">MATH-AI · GVCN</div><h1 class="text-3xl md:text-4xl font-black mt-1">Tổng quan lớp</h1><p class="text-slate-500 mt-1">Toàn cảnh lớp học trên một màn hình.</p></div><div class="px-4 py-2 bg-white rounded-xl border border-slate-200 text-sm font-bold text-slate-500">${new Date().toLocaleDateString('vi-VN')}</div></header>
<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">${card('ph-users','Tổng số học sinh',students.length,'blue')}${card('ph-chart-line','Điểm trung bình',classAvg().toFixed(2),'indigo')}${card('ph-star','Thi đua TB',(students.reduce((a,s)=>a+(Number(s.points)||0),0)/(students.length||1)).toFixed(1),'amber')}${card('ph-warning-circle','HS cần chú ý',students.filter(s=>(avg(s)??10)<6.5).length,'red')}</div>
<div class="grid lg:grid-cols-5 gap-6 mb-6"><section class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm"><div class="flex justify-between mb-6"><div><h2 class="font-black text-lg">Thống kê theo môn</h2><p class="text-sm text-slate-500">Điểm trung bình của từng môn.</p></div><i class="ph-fill ph-chart-bar text-2xl text-indigo-500"></i></div>${subs.length?subs.map(x=>`<div class="mb-5"><div class="flex justify-between text-sm font-bold mb-2"><span>${esc(x.name)}</span><span>${x.avg.toFixed(2)}</span></div><div class="h-2.5 rounded-full bg-slate-100"><div class="h-full rounded-full bg-indigo-500" style="width:${Math.min(100,x.avg*10)}%"></div></div></div>`).join(''):'<div class="py-12 text-center text-slate-400">Chưa có dữ liệu điểm theo môn.</div>'}</section><section class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm"><h2 class="font-black text-lg">HS nổi bật</h2><p class="text-sm text-slate-500 mb-4">Xếp theo điểm trung bình.</p>${[...students].sort((a,b)=>(avg(b)||0)-(avg(a)||0)).slice(0,5).map((s,i)=>`<button onclick="openStudent(${s.id})" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50 text-left"><span class="w-7 h-7 rounded-full bg-indigo-50 text-indigo-700 flex items-center justify-center text-xs font-black">${i+1}</span><span class="flex-1 font-bold truncate">${esc(s.name)}</span><span class="font-black text-indigo-600">${avg(s)?.toFixed(2)??'—'}</span></button>`).join('')}</section></div>
<section class="bg-white rounded-2xl border border-slate-200 p-5 md:p-6 shadow-sm"><div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3 mb-5"><div><h2 class="font-black text-lg">Danh sách học sinh</h2><p class="text-sm text-slate-500">Tìm kiếm · lọc · sắp xếp · mở hồ sơ.</p></div><div class="flex flex-col sm:flex-row gap-2"><input value="${esc(q)}" oninput="q=this.value;draw()" placeholder="Tìm tên hoặc tổ..." class="px-4 py-2.5 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-100"><select onchange="sort=this.value;draw()" class="px-4 py-2.5 rounded-xl border border-slate-200 font-bold"><option value="name">Tên A–Z</option><option value="avg" ${sort==='avg'?'selected':''}>Điểm TB ↓</option><option value="points" ${sort==='points'?'selected':''}>Thi đua ↓</option></select></div></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b text-left text-[10px] uppercase tracking-widest text-slate-400"><th class="pb-3">Học sinh</th><th>Tổ</th><th>Điểm TB</th><th>Thi đua</th><th class="text-right">Trạng thái</th></tr></thead><tbody>${rows.map(s=>`<tr onclick="openStudent(${s.id})" class="border-b last:border-0 hover:bg-slate-50 cursor-pointer"><td class="py-4 font-bold">${esc(s.name)}</td><td class="text-slate-500">${esc(s.group||'—')}</td><td class="font-black">${avg(s)?.toFixed(2)??'—'}</td><td class="font-bold">${Number(s.points)||0}</td><td class="text-right">${(avg(s)??10)<6.5?'<span class="px-3 py-1 rounded-full bg-red-50 text-red-600 text-xs font-bold">Cần chú ý</span>':'<span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 text-xs font-bold">Ổn định</span>'}</td></tr>`).join('')||'<tr><td colspan="5" class="py-10 text-center text-slate-400">Không tìm thấy học sinh.</td></tr>'}</tbody></table></div></section>${picked?modal(picked):''}`}
function openStudent(id){picked=students.find(s=>String(s.id)===String(id))||null;draw()}
function modal(s){return `<div class="fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4" onclick="picked=null;draw()"><div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl" onclick="event.stopPropagation()"><div class="flex justify-between"><div><div class="text-xs font-bold uppercase tracking-widest text-indigo-500">Hồ sơ học sinh</div><h2 class="text-2xl font-black mt-1">${esc(s.name)}</h2><p class="text-slate-500">${esc(s.group||'Chưa nhóm')}</p></div><button onclick="picked=null;draw()" class="p-2 rounded-xl hover:bg-slate-100"><i class="ph-bold ph-x text-xl"></i></button></div><div class="grid grid-cols-2 gap-3 mt-6">${Object.entries(s.scores||{}).map(([k,v])=>`<div class="bg-slate-50 rounded-xl p-4"><div class="text-xs text-slate-400 font-bold">${esc(k)}</div><div class="text-2xl font-black">${Number(v).toFixed(1)}</div></div>`).join('')||'<div class="col-span-2 text-slate-400">Chưa có điểm môn.</div>'}</div><div class="mt-4 p-4 rounded-xl bg-indigo-50 text-indigo-800 font-bold">Điểm TB: ${avg(s)?.toFixed(2)??'Chưa có dữ liệu'} · Thi đua: ${Number(s.points)||0}</div></div></div>`}
boot();
</script></body></html>
