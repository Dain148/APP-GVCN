        function compressImage(file, callback, max_size = 300, quality = 0.8) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } } 
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality)); 
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderViewHocSinh() {

                const group = state.groups.find(g => g.name === s.group);

                if (group) {
                    if (group.color.includes('red')) borderColorClass = 'border-red-400';
                    else if (group.color.includes('green')) borderColorClass = 'border-emerald-400';
                    else if (group.color.includes('yellow')) borderColorClass = 'border-yellow-400';
                    else if (group.color.includes('blue')) borderColorClass = 'border-blue-400';
                    else if (group.color.includes('purple')) borderColorClass = 'border-purple-400';
                    else if (group.color.includes('pink')) borderColorClass = 'border-pink-400';

                const currentPoints = s.points || 0; const milestones = [100, 300, 500]; let nextMilestoneVal = milestones.find(m => m > currentPoints) || 500;
                let pointsNeeded = Math.max(0, nextMilestoneVal - currentPoints); let progressPercent = Math.min(100, (currentPoints / nextMilestoneVal) * 100);
                
                let rankTitle = 'Chiến binh Sơ Cấp';

        // --- Helper functions for the new Points Form ---
        window.updatePointsForm = function(key, value) {
            state.pointsForm[key] = value;
            
            // If changing action type, reset quick selection related fields
            if (key === 'actionType') {
                state.pointsForm.pointsVal = 0;
                state.pointsForm.reason = '';
            }
            renderLayout();
        };

        // --- Validate input dynamically to prevent full re-render on typing ---
        window.validatePointsForm = function() {
            const pf = state.pointsForm;
            let canSubmit = false;
            
            if (pf.pointsVal > 0 && pf.reason.trim() !== '') {
                if (pf.targetType === 'class') canSubmit = true;
                else if (pf.selectedTargetId) canSubmit = true;
            }

            const btn = document.getElementById('points-submit-btn');
            const badge = document.getElementById('points-preview-badge');

            if (btn) {
                if (canSubmit) {
                    btn.disabled = false;
                    btn.className = "px-8 py-3.5 font-black rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm hover:-translate-y-0.5 bg-emerald-600 text-white hover:bg-emerald-700";
                } else {
                    btn.disabled = true;
                    btn.className = "px-8 py-3.5 font-black rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm hover:-translate-y-0.5 bg-slate-300 text-slate-500 cursor-not-allowed opacity-70";
                }
            }
            
            if (badge) {
                const sign = pf.actionType === 'add' ? '+' : '-';
                badge.innerText = `${sign}${pf.pointsVal > 0 ? pf.pointsVal : 0}đ`;
            }
        };

        window.applyQuickCriterion = function(reason, points, category) {
            state.pointsForm.reason = reason;
            state.pointsForm.pointsVal = points;
            state.pointsForm.category = category || 'Khác';
            renderLayout();
        };

        window.resetPointsForm = function() {
            state.pointsForm = {
                actionType: 'add', targetType: 'student', selectedTargetId: '', pointsVal: 0, category: 'Học tập', reason: '', note: ''
            };
            renderLayout();
        };

       window.executePointsSubmission = function() {
            const pf = state.pointsForm;
            const pointsToApply = pf.actionType === 'add' ? parseInt(pf.pointsVal) : -parseInt(pf.pointsVal);
            
            if (isNaN(pointsToApply) || pointsToApply === 0) return showToast("Số điểm không hợp lệ!", "error");
            if (!pf.reason.trim()) return showToast("Vui lòng nhập lý do!", "error");
            let targetStudents = [];
            let successMsg = "";
            
            if (pf.targetType === 'student') {
                const s = state.students.find(x => x.id.toString() === pf.selectedTargetId.toString());
                if (!s) return showToast("Vui lòng chọn học sinh!", "error");
                targetStudents.push(s);
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho ${s.name}`;
            } 
            else if (pf.targetType === 'group') {
                targetStudents = state.students.filter(x => x.group === pf.selectedTargetId);
                if (targetStudents.length === 0) return showToast(`Nhóm ${pf.selectedTargetId} chưa có học sinh!`, "error");
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Tổ ${pf.selectedTargetId}`;
            } 
            else if (pf.targetType === 'class') {
                targetStudents = [...state.students];
                if (targetStudents.length === 0) return showToast("Lớp chưa có học sinh!", "error");
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Toàn Lớp`;
            }
            
            // --- TÍNH NĂNG TỰ ĐỘNG HỌC MẪU MỚI ---
            const currentReason = pf.reason.trim();
            const absVal = Math.abs(pointsToApply);
            const targetCriteriaList = pf.actionType === 'add' ? state.criteria.positive : state.criteria.negative;
            
            // Kiểm tra xem mẫu này đã có trong danh sách chưa (so sánh chữ không phân biệt hoa thường và số điểm)
            const isExist = targetCriteriaList.find(c => c.reason.toLowerCase() === currentReason.toLowerCase() && c.points === absVal);
            if (!isExist) {
                targetCriteriaList.push({
                    points: absVal,
                    reason: currentReason,
                    category: pf.category || 'Khác'
                });
            }
            // --- KẾT THÚC ---

            // Apply points and log history
            const historyEntry = {
                id: Date.now(),
                date: new Date().toISOString(),
                points: pointsToApply,
                reason: currentReason + (pf.note ? ` (${pf.note.trim()})` : '') + ` [${pf.category}]`
            };
            targetStudents.forEach(s => {
                s.points = Math.max(0, (s.points || 0) + pointsToApply);
                s.stars = Math.max(0, (s.stars || 0) + pointsToApply);
                if (!s.history) s.history = [];
                s.history.push({...historyEntry, id: Date.now() + Math.random()}); // Ensure unique IDs if bulk
            });
            saveData();
            
            // Reset form partly for continuous use
            state.pointsForm.pointsVal = 0;
            state.pointsForm.reason = '';
            state.pointsForm.note = '';
            
            renderLayout();
            showToast(successMsg, pointsToApply > 0 ? "success" : "error");
            if (pointsToApply > 0) triggerConfetti();
        };

        function selectStudentForRewards(id) { state.selectedStudentForRewards = id; renderLayout(); }

        // Keeping these two logic functions just in case they are referenced somewhere else historically
        function awardPoints(points, reason) {
            console.log('Legacy awardPoints called, routing to form...', points, reason);
        }
        function awardCustomPoints() {
            console.log('Legacy custom points called');
        }
        function saveNewCriterion() {
            const val = state.pointsForm.pointsVal;
            const reason = state.pointsForm.reason.trim();
            const category = state.pointsForm.category;
            
            if (isNaN(val) || val <= 0) return showToast("Vui lòng nhập số điểm > 0 để lưu mẫu!", "error");
            if (!reason) return showToast("Vui lòng nhập lý do tiêu chí!", "error");
            
            if (state.pointsForm.actionType === 'add') {
                state.criteria.positive.push({ points: val, reason: reason, category: category });
            } else {
                state.criteria.negative.push({ points: val, reason: reason, category: category });
            }
            saveData(); renderLayout(); showToast("Đã lưu tiêu chí mới thành công!");
        }
        
        function deleteCriterion(type, index) {
            if (confirm("Xóa tiêu chí này khỏi danh sách?")) { state.criteria[type].splice(index, 1); saveData(); renderLayout(); showToast("Đã xóa"); }
        }

        function renderViewDoiQua() {
            const selectedStudentId = state.selectedStudentForRewards || null;
            const student = state.students.find(s => s.id === selectedStudentId);
            const sortedStudents = [...state.students].sort((a, b) => (b.stars||0) - (a.stars||0));
            
            const studentListHtml = sortedStudents.map(s => `
                <button onclick="selectStudentForRewards(${s.id})" class="flex-shrink-0 w-32 rounded-2xl flex flex-col items-center justify-center p-4 transition-all duration-300 relative overflow-hidden group ${s.id === selectedStudentId ? 'bg-gradient-to-b from-blue-50 to-white border-2 border-blueAccent shadow-md transform -translate-y-2' : 'border border-slate-200 hover:bg-slate-50 bg-white hover:shadow-sm'}">
                    ${s.id === selectedStudentId ? '<div class="absolute top-0 w-full h-1 bg-blueAccent"></div>' : ''}
                    ${getAvatarImg(s.avatarUrl, s.name, "w-14 h-14 ring-2 ring-slate-100 shadow-sm mb-3 group-hover:scale-110 transition-transform")}
                    <div class="text-sm font-bold text-slate-800 truncate w-full text-center mb-2">${s.name.split(' ').pop()}</div>

            const catalogHtml = (state.rewards || []).map(item => {
                let btnHtml = !student ? `<button class="w-full py-3.5 bg-slate-100 text-slate-400 font-bold rounded-xl text-xs uppercase tracking-wide cursor-not-allowed">Chọn học sinh</button>` : 
                              (student.stars || 0) >= item.cost ? `<button onclick="executeRedeem('${student.id}', '${item.id}')" class="w-full py-3.5 bg-primary hover:bg-secondary text-white font-bold rounded-xl text-xs uppercase tracking-wide shadow-md hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2"><i class="ph-bold ph-hand-coins text-lg"></i> Đổi quà</button>` :
                              `<button class="w-full py-3.5 bg-slate-50 border border-slate-200 text-slate-400 font-bold rounded-xl text-xs uppercase tracking-wide cursor-not-allowed">Thiếu ${item.cost - (student.stars||0)} sao</button>`;
                return `
                    <div class="bg-white rounded-[2rem] p-2 shadow-sm hover:shadow-xl transition-all duration-300 group border border-slate-200 relative overflow-hidden flex flex-col h-full hover:-translate-y-2">
                        <div class="absolute top-0 right-0 w-32 h-32 ${item.bg.replace('100', '200')}/40 rounded-bl-full -mr-10 -mt-10 transition-transform duration-500 group-hover:scale-125 z-0"></div>
                        <div class="bg-white rounded-[1.6rem] p-6 md:p-8 flex flex-col h-full relative z-10">
                            <div class="w-16 h-16 ${item.bg} rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform shadow-sm border border-white ring-4 ring-slate-50"><i class="ph-fill ${item.icon} text-3xl ${item.color}"></i></div>
                            <h4 class="font-black text-slate-800 text-xl mb-2 leading-tight">${item.name}</h4>

                                <div class="flex flex-col"><span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">CẦN ĐỂ ĐỔI</span><div class="flex items-center gap-1.5 font-black text-slate-800 text-3xl">${item.cost} <i class="ph-fill ph-star text-accent animate-pulse"></i></div></div>

            return `
                <div class="max-w-7xl mx-auto animate-fade-in space-y-8 pb-12">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center py-2 border-b border-slate-200 pb-6 gap-4">
                        <div>
                            <h2 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3"><i class="ph-fill ph-storefront text-accent"></i> Cửa Hàng Đổi Quà</h2>

                    </div>

                        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4=')]"></div>
                        <div class="flex-1 w-full bg-white/10 backdrop-blur-md p-6 md:p-8 rounded-[1.5rem] border border-white/20 flex flex-col sm:flex-row items-center gap-6 relative z-10 shadow-inner">
                            <div class="w-20 h-20 bg-gradient-to-br from-yellow-300 to-orange-500 text-white rounded-3xl flex items-center justify-center shadow-[0_10px_30px_rgba(245,158,11,0.5)] border-2 border-white/30 transform -rotate-6"><i class="ph-fill ph-gift text-4xl"></i></div>
                            <div class="flex-1 w-full text-center sm:text-left">
                                <div class="text-[11px] text-indigo-200 font-bold uppercase tracking-widest mb-2">BƯỚC 1: CHỌN NGƯỜI ĐỔI QUÀ</div>
                                <select onchange="selectStudentForRewards(parseInt(this.value))" class="w-full text-xl md:text-2xl font-black text-white bg-transparent focus:outline-none cursor-pointer border-b-2 border-white/30 pb-3 focus:border-white transition-colors">
                                    <option value="" class="text-slate-800">-- Nhấp để chọn học sinh --</option>
                                    ${state.students.map(s => `<option value="${s.id}" class="text-slate-800" ${s.id === selectedStudentId ? 'selected' : ''}>${s.name} (${s.stars} sao)</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <div class="bg-white p-6 md:p-8 rounded-[1.5rem] shadow-2xl w-full lg:w-auto flex items-center justify-center gap-10 relative z-10 min-w-[320px]">
                            <div class="text-center"><div class="text-[11px] text-slate-400 font-bold uppercase tracking-widest mb-1">TỔNG ĐIỂM</div><div class="text-3xl font-black text-slate-800">${student ? student.points : '0'}</div></div>
                            <div class="w-px h-16 bg-slate-200"></div>
                            <div class="text-center"><div class="text-[11px] text-orange-500 font-bold uppercase tracking-widest mb-1">SAO HIỆN CÓ</div><div class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-br from-orange-400 to-red-500 flex items-center justify-center gap-2">${student ? (student.stars || 0) : '0'} <i class="ph-fill ph-star text-accent text-3xl animate-spin-slow"></i></div></div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-200 relative">
                        <div class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2"><i class="ph-bold ph-users text-lg"></i> Chọn nhanh học sinh (Sắp xếp theo sao)</div>
                        <div class="flex overflow-x-auto gap-4 pb-4 px-2 pt-2 custom-scrollbar">${studentListHtml || '<div class="text-slate-400 italic text-sm">Chưa có học sinh</div>'}</div>
                    </div>
                    
                    <div class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-8 mb-4 flex items-center gap-2"><i class="ph-bold ph-storefront text-lg"></i> Danh mục quà tặng</div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6 xl:gap-8">${catalogHtml}</div>
                </div>
            `;
        }

        function executeRedeem(studentId, itemId) {
            const student = state.students.find(s => s.id === parseInt(studentId));
            const item = state.rewards.find(i => i.id === itemId);
            if (student && item && (student.stars || 0) >= item.cost) {
                if(confirm(`Đổi "${item.name}" cho ${student.name} với giá ${item.cost} sao?\nSau khi đổi, sao sẽ bị trừ nhưng tổng điểm không đổi.`)) {
                    student.stars -= item.cost; saveData(); renderLayout(); showToast(`Đã đổi quà thành công!`); triggerConfetti();
                }
            }
        }

        function renderViewNhomThiDua() {
            const groupsWithStats = state.groups.map(g => {
                const members = state.students.filter(s => s.group === g.name);
                const totalPoints = members.reduce((sum, s) => sum + (s.points || 0), 0);
                return { ...g, members, totalPoints };
            }).sort((a, b) => b.totalPoints - a.totalPoints);
            
            const maxGroupPoints = Math.max(...groupsWithStats.map(g => g.totalPoints), 1);

            const groupCardsHtml = groupsWithStats.map((g, index) => {
                let wrapperClass = 'border border-slate-200 hover:border-blue-300 shadow-sm hover:shadow-xl hover:-translate-y-2';
                let innerClass = 'bg-white rounded-[2rem]';
                let rankBadge = '';
                let pointColor = 'bg-slate-50 text-slate-700 border border-slate-200';
                let bgHeader = 'bg-transparent';
                let progressColor = 'from-blue-400 to-blueAccent';

                if (index === 0 && g.totalPoints > 0) {
                    wrapperClass = 'p-1.5 bg-gradient-to-br from-[#fde047] via-[#f59e0b] to-[#d97706] shadow-[0_10px_30px_rgba(245,158,11,0.25)] hover:-translate-y-3 border-none transform md:scale-[1.02] z-10';
                    rankBadge = `<div class="absolute -top-5 -left-5 w-14 h-14 bg-gradient-to-br from-[#fde047] to-[#f59e0b] rounded-full text-white font-black text-2xl shadow-lg flex items-center justify-center z-20 border-4 border-white"><i class="ph-fill ph-crown text-3xl absolute -top-5 text-yellow-300 drop-shadow-md"></i>1</div>`;
                    pointColor = 'bg-gradient-to-r from-orange-400 to-red-500 text-white shadow-md border border-red-400/50';
                    bgHeader = 'bg-gradient-to-b from-yellow-50 to-transparent';
                    progressColor = 'from-yellow-400 to-orange-500';
                    innerClass = 'bg-white rounded-[1.6rem]';
                }

                const sortedMembers = [...g.members].sort((a,b) => (b.points || 0) - (a.points || 0));
                let membersListHtml = sortedMembers.map((m, i) => `
                    <div class="flex items-center gap-3.5 bg-white p-3 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-all cursor-pointer group/member mb-2" onclick="switchTab('tich-diem'); selectStudentForPoints(${m.id})">
                        <div class="text-[10px] font-bold text-slate-300 w-3 text-center">${i+1}</div>
                        ${getAvatarImg(m.avatarUrl, m.name, "w-10 h-10 flex-shrink-0 group-hover/member:scale-110 transition-transform")}
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-bold text-slate-800 truncate mb-0.5">${m.name}</div>
                            <div class="text-[9px] text-slate-400 font-bold uppercase tracking-wider truncate">${m.role || 'Thành viên'}</div>
                        </div>
                        <div class="text-sm font-bold ${m.points > 0 ? 'text-blueAccent' : 'text-slate-400'} bg-slate-50 px-2.5 py-1.5 rounded-xl border border-slate-100">${m.points || 0}</div>
                    </div>
                `).join('');

                if (sortedMembers.length === 0) membersListHtml = `<div class="text-xs text-slate-400 font-medium italic text-center py-10 bg-slate-50/50 rounded-2xl border border-dashed border-slate-200">Chưa có thành viên nào</div>`;
                const progressPercent = maxGroupPoints > 0 ? (g.totalPoints / maxGroupPoints) * 100 : 0;

                return `
                    <div class="rounded-[2rem] bg-white relative group h-full transition-all duration-300 ${wrapperClass} flex flex-col">
                        ${rankBadge}
                        <div class="${innerClass} h-full flex flex-col overflow-hidden relative z-10 flex-1">
                            <div class="p-6 pb-5 ${bgHeader} relative border-b border-slate-100">
                                <div class="flex justify-between items-start mb-5">
                                    <div class="flex items-center gap-4 pr-2">
                                        ${g.avatarUrl ? `<img src="${g.avatarUrl}" class="w-16 h-16 rounded-2xl object-cover shadow-sm ring-4 ring-white">` : `<div class="w-16 h-16 rounded-2xl bg-white flex items-center justify-center shadow-sm ring-4 ring-slate-50 border border-slate-100"><i class="ph-fill ph-users-three text-3xl ${g.color}"></i></div>`}
                                        <div>
                                            <h3 class="font-black text-slate-800 text-xl tracking-tight leading-none mb-2">${g.name}</h3>
                                            <div class="text-[10px] font-bold text-slate-500 uppercase flex items-center gap-1.5 bg-slate-100 px-2 py-1 rounded inline-block"><i class="ph-fill ph-users"></i> ${g.members.length} Thành viên</div>
                                        </div>
                                    </div>
                                    <div class="flex flex-col items-end flex-shrink-0">
                                        <div class="px-4 py-2.5 rounded-xl ${pointColor} flex items-center gap-1.5">
                                            <span class="font-black text-2xl leading-none">${g.totalPoints}</span>
                                            <i class="ph-fill ph-star text-base ${index === 0 ? 'text-yellow-200 animate-pulse' : ''}"></i>
                                        </div>
                                    </div>
                                </div>
                                <div class="absolute top-4 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity flex gap-2 bg-white/95 backdrop-blur-md p-2 rounded-xl shadow-lg z-20 border border-slate-100">
                                    <button onclick="pickRandomInGroup('${g.id}')" title="Quay random trong nhóm" class="text-slate-500 hover:text-purple-600 p-2 rounded-lg bg-slate-50 hover:bg-purple-50 transition-colors"><i class="ph-fill ph-dice-three text-lg"></i></button>
                                    <button onclick="openEditGroupModal('${g.id}')" title="Sửa nhóm" class="text-slate-500 hover:text-blueAccent p-2 rounded-lg bg-slate-50 hover:bg-blue-50 transition-colors"><i class="ph-fill ph-pencil-simple text-lg"></i></button>
                                    <button onclick="deleteGroup('${g.id}')" title="Xóa nhóm" class="text-slate-500 hover:text-red-500 p-2 rounded-lg bg-slate-50 hover:bg-red-50 transition-colors"><i class="ph-fill ph-trash text-lg"></i></button>
                                </div>
                                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden shadow-inner relative">
                                    <div class="absolute top-0 left-0 h-full bg-gradient-to-r ${progressColor} rounded-full transition-all duration-1000 ease-out" style="width: ${progressPercent}%"></div>
                                </div>
                            </div>
                            <div class="p-5 bg-slate-50/50 flex-1 flex flex-col overflow-y-auto custom-scrollbar" style="max-height: 320px;">${membersListHtml}</div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="max-w-7xl mx-auto animate-fade-in space-y-8 pb-12">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center py-2 border-b border-slate-200 pb-6 gap-4">
                        <div>
                            <h2 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3"><i class="ph-fill ph-flag-pennant text-blueAccent"></i> Bảng Đua Các Tổ</h2>

                            <button onclick="addNewGroup()" class="px-5 py-3 bg-primary text-white font-bold rounded-xl shadow-md hover:bg-secondary transition-all flex items-center gap-2 text-sm"><i class="ph-bold ph-plus text-xl"></i> Thêm Tổ mới</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 xl:gap-8 pt-4">${groupCardsHtml || '<div class="col-span-full text-center py-10 text-slate-400 font-medium">Chưa có tổ nào được tạo.</div>'}</div>
                </div>
            `;
        }

        window.switchAttendanceTab = function(tab) { 
            state.attendanceTab = tab; 
            renderLayout(); 
        };

        function renderViewDiemDanh() {
            if (!state.attendanceRecords) state.attendanceRecords = {};
            if (!state.attendanceTab) state.attendanceTab = 'diem-danh';
            let contentHtml = '';

            // --- TAB THỰC HIỆN ĐIỂM DANH ---
            if (state.attendanceTab === 'diem-danh') {
                if (!state.attendanceRecords[currentAttendanceDate]) state.attendanceRecords[currentAttendanceDate] = {};
                const currentRecord = state.attendanceRecords[currentAttendanceDate];
                const sortedDates = Object.keys(state.attendanceRecords).sort((a,b) => new Date(b) - new Date(a));

                const tableRowsHtml = state.students.map((s, idx) => {
                    const status = currentRecord[s.id] || null;
                    
                    // Hàm render nút bấm điểm danh
                    const renderButton = (val, label, colorTheme) => {
                        const isChecked = status === val;
                        let activeClass = '', idleClass = '';
                        
                        // Màu khi đang chọn (đậm)
                        if (colorTheme === 'emerald') { activeClass = 'bg-white text-emerald-500 border-emerald-500'; idleClass = 'bg-white text-emerald-500/50 border-emerald-500/30 hover:border-emerald-500/50'; }
                        else if (colorTheme === 'yellow') { activeClass = 'bg-white text-yellow-500 border-yellow-500'; idleClass = 'bg-white text-yellow-500/50 border-yellow-500/30 hover:border-yellow-500/50'; }
                        else if (colorTheme === 'blue') { activeClass = 'bg-white text-blue-500 border-blue-500'; idleClass = 'bg-white text-blue-500/50 border-blue-500/30 hover:border-blue-500/50'; }
                        else if (colorTheme === 'red') { activeClass = 'bg-white text-red-500 border-red-500'; idleClass = 'bg-white text-red-500/50 border-red-500/30 hover:border-red-500/50'; }
                        
                        return `<button onclick="markAttendance(${s.id}, '${val}')" class="w-full h-11 rounded-[0.8rem] border-[1.5px] ${isChecked ? activeClass + ' font-bold' : idleClass + ' font-medium'} transition-colors text-xs flex items-center justify-center">${label}</button>`;
                    };

                    // Lấy lịch sử vi phạm
                    let lateDates = [], excusedDates = [], unexcusedDates = [];
                    sortedDates.forEach(date => {
                        const dStatus = state.attendanceRecords[date][s.id];
                        if (!dStatus || dStatus === 'present') return;
                        const p = date.split('-'); const formattedDate = `${p[2]}/${p[1]}`;
                        if (dStatus === 'late') lateDates.push(formattedDate); 
                        else if (dStatus === 'excused') excusedDates.push(formattedDate); 
                        else if (dStatus === 'unexcused') unexcusedDates.push(formattedDate);
                    });

                    // Khối hiển thị lịch sử vi phạm ngay dưới tên học sinh
                    let historyHtml = '';
                    if (lateDates.length > 0 || excusedDates.length > 0 || unexcusedDates.length > 0) {
                        let badges = '';
                        if (lateDates.length > 0) badges += `<div class="flex items-center gap-3"><span class="bg-yellow-100 text-yellow-600 px-2 py-1 rounded text-[10px] font-bold w-16 text-center">Đi muộn</span> <span class="text-xs text-slate-600 font-medium">${lateDates.join(', ')}</span></div>`;
                        if (excusedDates.length > 0) badges += `<div class="flex items-center gap-3"><span class="bg-blue-100 text-blue-600 px-2 py-1 rounded text-[10px] font-bold w-16 text-center">Vắng (P)</span> <span class="text-xs text-slate-600 font-medium">${excusedDates.join(', ')}</span></div>`;
                        if (unexcusedDates.length > 0) badges += `<div class="flex items-center gap-3"><span class="bg-red-100 text-red-500 px-2 py-1 rounded text-[10px] font-bold w-16 text-center">Vắng (KP)</span> <span class="text-xs text-slate-600 font-medium">${unexcusedDates.join(', ')}</span></div>`;
                        
                        historyHtml = `
                            <div class="mt-4 flex flex-col gap-2 pl-2 border border-dashed border-slate-200 rounded-xl p-3 bg-slate-50/50 ml-14 w-max min-w-[250px]">
                                <div class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mb-1">LỊCH SỬ VI PHẠM CHUYÊN CẦN</div>
                                <div class="flex flex-col gap-1.5">${badges}</div>
                            </div>
                        `;
                    }

                    return `
                        <div class="flex flex-col xl:flex-row py-5 border-b border-slate-100 hover:bg-slate-50/50 transition-colors px-6 md:px-8 gap-6 bg-white items-start xl:items-center">
                            <div class="w-full xl:w-5/12 flex flex-col">
                                <div class="flex items-center gap-4">
                                    ${getAvatarImg(s.avatarUrl, s.name, "w-10 h-10")}
                                    <div class="flex-1 min-w-0">
                                        <div class="font-black text-[15px] text-slate-800 mb-0.5">${s.name}</div>
                                        <div class="text-[10px] text-slate-500 font-bold uppercase bg-slate-100 px-2 py-0.5 rounded inline-block">${s.group}</div>
                                    </div>
                                </div>
                                ${historyHtml}
                            </div>
                            <div class="w-full xl:w-7/12 flex items-center gap-3 flex-wrap sm:flex-nowrap">
                                <div class="w-[calc(50%-0.375rem)] sm:w-auto flex-1">${renderButton('present', 'Có mặt', 'emerald')}</div>
                                <div class="w-[calc(50%-0.375rem)] sm:w-auto flex-1">${renderButton('late', 'Đi muộn', 'yellow')}</div>
                                <div class="w-[calc(50%-0.375rem)] sm:w-auto flex-1">${renderButton('excused', 'Vắng (P)', 'blue')}</div>
                                <div class="w-[calc(50%-0.375rem)] sm:w-auto flex-1">${renderButton('unexcused', 'Vắng (KP)', 'red')}</div>
                            </div>
                        </div>
                    `;
                }).join('');

                contentHtml = `
                    <div class="flex flex-wrap justify-between items-center gap-4 bg-white p-5 rounded-[2rem] shadow-sm border border-slate-200 mb-6 relative z-10">
                        <div class="flex bg-slate-50 p-1.5 rounded-xl w-full md:w-auto">
                            <button onclick="switchAttendanceTab('diem-danh')" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg text-sm font-bold bg-white text-blueAccent shadow-sm">Thực hiện điểm danh</button>
                            <button onclick="switchAttendanceTab('thong-ke')" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg text-sm font-bold text-slate-500 hover:text-slate-800 transition-colors">Bảng thống kê</button>

        function markAttendance(id, status) {

        function changeAttendanceDate(d) { if(d) { currentAttendanceDate = d; renderLayout(); } }

        // --- NEW RANDOM PICKER ENGINE VARIABLES ---
        let pickerMode = 'chaos'; // chaos, spiral, wave, planet, figure8, bubbles
        let pickerBg = 'default';
        let pickerTime = 3;
        let pickerItems = [];
        let isPicking = false;
        let pickerAnimationId = null;
        let pickTarget = 'student'; // 'student' or 'group'

        function renderViewVongQuay() {
            // Chuẩn bị danh sách
            const listItems = pickTarget === 'student' ? state.students : state.groups;
            
            // Render Background classes based on selected option
            let stageBgClass = 'bg-slate-50';
            if(pickerBg === 'cucquang') stageBgClass = 'bg-gradient-to-br from-purple-500 via-pink-500 to-red-500';
            else if(pickerBg === 'xoaytim') stageBgClass = 'bg-gradient-to-br from-[#1e1b4b] to-purple-900';
            else if(pickerBg === 'luadem') stageBgClass = 'bg-slate-900';
            else if(pickerBg === 'songtim') stageBgClass = 'bg-gradient-to-r from-fuchsia-600 to-purple-600';
            else if(pickerBg === 'daiduong') stageBgClass = 'bg-gradient-to-br from-cyan-500 to-blue-700';

            };

            // Helper for background buttons
            const renderBgBtn = (id, colorClass, label) => {
                const isActive = pickerBg === id;
                return `<button onclick="changePickerBg('${id}')" class="h-10 rounded-xl text-xs font-bold text-white shadow-sm transition-all border-2 ${isActive ? 'border-emerald-500 scale-105' : 'border-transparent hover:scale-105'} ${colorClass}">${label}</button>`;

                        <div class="mb-6 space-y-3">

                            <div class="flex gap-3">
                                ${renderEffectBtn('chaos', 'ph-arrows-out', 'Hỗn loạn')}
                                ${renderEffectBtn('spiral', 'ph-spiral', 'Trôn ốc')}
                            </div>
                            <div class="flex gap-3">
                                ${renderEffectBtn('planet', 'ph-planet', 'Hành tinh')}
                                ${renderEffectBtn('wave', 'ph-wave-sine', 'Sóng')}
                            </div>
                            <div class="flex gap-3">
                                ${renderEffectBtn('bubbles', 'ph-circles-three', 'Bong bóng')}
                                ${renderEffectBtn('figure8', 'ph-infinity', 'Số 8')}

                            <div class="grid grid-cols-2 gap-2.5">
                                <button onclick="changePickerBg('default')" class="h-10 rounded-xl text-xs font-bold text-slate-600 bg-white shadow-sm transition-all border-2 ${pickerBg==='default' ? 'border-emerald-500' : 'border-slate-200 hover:border-slate-300'}">Mặc định</button>
                                ${renderBgBtn('cucquang', 'bg-gradient-to-r from-pink-500 to-purple-500', 'Cực quang')}
                                ${renderBgBtn('xoaytim', 'bg-gradient-to-r from-[#1e1b4b] to-purple-600', 'Xoáy tím')}
                                ${renderBgBtn('luadem', 'bg-slate-900', 'Lửa đêm')}
                                ${renderBgBtn('songtim', 'bg-fuchsia-500', 'Sóng tím')}
                                ${renderBgBtn('daiduong', 'bg-cyan-600', 'Đại dương')}
                            </div>
                        </div>

                        <div class="mt-auto space-y-4">
                            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-bold text-slate-600">Thời gian gọi:</span>
                                    <span class="text-sm font-black text-emerald-600">${pickerTime}s</span>
                                </div>
                                <input type="range" min="1" max="10" value="${pickerTime}" onchange="pickerTime=parseInt(this.value); renderLayout();" class="w-full accent-emerald-600 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                            </div>

                            <button onclick="startPicking()" id="btn-start-pick" class="w-full py-4 bg-emerald-600 text-white font-black rounded-2xl shadow-lg hover:bg-emerald-700 transition-all hover:-translate-y-1 flex items-center justify-center gap-2 text-lg">
                                <i class="ph-fill ph-play text-2xl"></i> BẮT ĐẦU GỌI
                            </button>
                        </div>
                    </div>

                    <!-- STAGE -->
                    <div class="flex-1 rounded-[2rem] overflow-hidden relative border border-slate-200 shadow-inner ${stageBgClass} transition-colors duration-500" id="picker-stage">
                        <!-- Thẻ (Cards) sẽ được render vào đây bằng JS -->
                    </div>
                </div>
            `;
        }

        window.changePickerMode = function(mode) { pickerMode = mode; renderLayout(); }
        window.changePickerBg = function(bg) { pickerBg = bg; renderLayout(); }
        window.changePickTarget = function(target) { pickTarget = target; renderLayout(); }

        function initPickerCards() {
            const stage = document.getElementById('picker-stage');
            if (!stage) return;
            stage.innerHTML = ''; // Clear old cards
            
            const listItems = pickTarget === 'student' ? state.students : state.groups;
            if(listItems.length === 0) {
                stage.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-xl font-bold ${pickerBg === 'default' ? 'text-slate-400' : 'text-white/50'}">Chưa có dữ liệu.</div>`;
                return;
            }

            pickerItems = listItems.map((item, index) => {
                const el = document.createElement('div');
                el.className = `absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl p-3 shadow-lg flex flex-col items-center justify-center gap-2 transition-transform border border-slate-100 will-change-transform z-10`;
                el.style.width = '110px';
                el.style.height = '130px';
                
                // Color theme for avatar border
                const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
                const borderColor = colors[index % colors.length];

                let avatarHtml = '';
                if(pickTarget === 'student') {
                    avatarHtml = getAvatarImg(item.avatarUrl, item.name, "w-16 h-16 pointer-events-none ring-4 ring-white");
                } else {
                    avatarHtml = item.avatarUrl ? `<img src="${item.avatarUrl}" class="w-16 h-16 rounded-full object-cover ring-4 ring-white pointer-events-none">` : `<div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center ring-4 ring-white"><i class="ph-fill ph-users-three text-3xl text-slate-400"></i></div>`;
                }

                el.innerHTML = `
                    <div class="rounded-full p-1" style="background: linear-gradient(135deg, ${borderColor} 0%, transparent 100%);">
                        ${avatarHtml}
                    </div>
                    <div class="text-xs font-black text-slate-800 text-center w-full truncate leading-tight pointer-events-none">${item.name}</div>
                `;
                
                stage.appendChild(el);

                // Initial random positions
                const stageWidth = stage.offsetWidth;
                const stageHeight = stage.offsetHeight;
                
                return {
                    el: el,
                    data: item,
                    x: (Math.random() - 0.5) * (stageWidth - 150),
                    y: (Math.random() - 0.5) * (stageHeight - 150),
                    angle: Math.random() * Math.PI * 2,
                    speed: 0.5 + Math.random() * 1.5,
                    radius: 50 + Math.random() * 200, // for spiral/planet
                    baseX: 0, baseY: 0 // offset
                };
            });
        }

        function animatePicker() {
            if(!pickerItems.length) return;
            const stage = document.getElementById('picker-stage');
            if (!stage) { cancelAnimationFrame(pickerAnimationId); return; }
            
            const stageWidth = stage.offsetWidth;
            const stageHeight = stage.offsetHeight;
            const time = performance.now() / 1000; // time in seconds

            pickerItems.forEach((item, i) => {
                // Tốc độ thay đổi dựa trên việc có đang Pick (quay số) hay không
                const speedMulti = isPicking ? 8 : 1; 

                if (pickerMode === 'chaos') {
                    item.x += Math.cos(item.angle) * item.speed * speedMulti;
                    item.y += Math.sin(item.angle) * item.speed * speedMulti;
                    // Bouncing off walls
                    const boundX = stageWidth/2 - 60;
                    const boundY = stageHeight/2 - 70;
                    if (item.x > boundX || item.x < -boundX) item.angle = Math.PI - item.angle;
                    if (item.y > boundY || item.y < -boundY) item.angle = -item.angle;
                    
                    // Add some random noise
                    item.angle += (Math.random() - 0.5) * 0.1 * speedMulti;
                } 
                else if (pickerMode === 'spiral') {
                    const t = time * item.speed * speedMulti + i;
                    const r = (Math.sin(time * 0.5) * 0.5 + 0.5) * 300 + 50; // Radius expands and contracts
                    item.x = Math.cos(t) * r;
                    item.y = Math.sin(t) * r;
                }
                else if (pickerMode === 'planet') {
                    // Center is sun, others orbit
                    const t = time * (item.speed/2) * speedMulti;
                    item.x = Math.cos(t + i) * item.radius;
                    item.y = Math.sin(t + i) * item.radius;
                }
                else if (pickerMode === 'wave') {
                    item.x += item.speed * speedMulti * 2;
                    if(item.x > stageWidth/2 + 60) item.x = -stageWidth/2 - 60; // wrap around
                    item.y = Math.sin(item.x / 100 + time * 5) * 150;
                }
                else if (pickerMode === 'bubbles') {
                    item.y -= item.speed * speedMulti * 2;
                    if(item.y < -stageHeight/2 - 70) item.y = stageHeight/2 + 70;
                    item.x = Math.sin(item.y / 50 + time * 3 + i) * 100 + item.baseX;
                }
                else if (pickerMode === 'figure8') {
                    const t = time * item.speed * speedMulti + i;
                    item.x = Math.sin(t) * (stageWidth/3);
                    item.y = Math.sin(t) * Math.cos(t) * (stageHeight/3);
                }

                // Keep within bounds roughly
                item.x = Math.max(-stageWidth/2 + 55, Math.min(stageWidth/2 - 55, item.x));
                item.y = Math.max(-stageHeight/2 + 65, Math.min(stageHeight/2 - 65, item.y));

                // Apply transform relative to center
                item.el.style.transform = `translate(calc(-50% + ${item.x}px), calc(-50% + ${item.y}px))`;
            });

            if(!isPicking || performance.now() < pickEndTime) {
                pickerAnimationId = requestAnimationFrame(animatePicker);
            }
        }

        let pickEndTime = 0;
        window.startPicking = function() {
            if(pickerItems.length === 0) return showToast("Chưa có danh sách!", "error");
            if(isPicking) return;
            
            isPicking = true;
            document.getElementById('btn-start-pick').innerHTML = `<i class="ph-bold ph-spinner-gap text-2xl animate-spin"></i> ĐANG GỌI...`;
            document.getElementById('btn-start-pick').classList.replace('bg-emerald-600', 'bg-slate-400');
            
            // Start sounds
            if (Tone.context.state !== 'running') Tone.start();
            let clickSynth = null;
            try { clickSynth = new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination(); clickSynth.volume.value = -15; } catch(e) {}
            
            let soundInterval = setInterval(() => {
                if(clickSynth && Tone.context.state === 'running') clickSynth.triggerAttackRelease("G5", "32n", Tone.now());
            }, 150);

            pickEndTime = performance.now() + (pickerTime * 1000);

            setTimeout(() => {
                clearInterval(soundInterval);
                finishPick();
            }, pickerTime * 1000);
        }

        function finishPick() {
            isPicking = false;
            cancelAnimationFrame(pickerAnimationId);
            
            const btn = document.getElementById('btn-start-pick');
            if(btn){
                btn.innerHTML = `<i class="ph-fill ph-play text-2xl"></i> GỌI TIẾP`;
                btn.classList.replace('bg-slate-400', 'bg-emerald-600');
            }

            // Chọn ngẫu nhiên 1 người
            const winnerIndex = Math.floor(Math.random() * pickerItems.length);
            const winner = pickerItems[winnerIndex];

            // Tái tạo âm thanh chiến thắng
            try { 
                const s = new Tone.PolySynth().toDestination(); 
                s.volume.value = -10;
                s.triggerAttackRelease(['C5','E5','G5', 'C6'], "2n"); 
            } catch(e){}
            triggerConfetti();

            // Hiển thị modal người thắng
            let actionBtnHtml = '';
            if (pickTarget === 'student') {
                actionBtnHtml = `<button onclick="switchTab('tich-diem'); selectStudentForPoints(${winner.data.id}); closeModal('random-result-modal');" class="mt-8 px-10 py-4 bg-emerald-500 text-white font-black rounded-2xl shadow-lg hover:bg-emerald-600 transition-all hover:-translate-y-1 w-full flex items-center justify-center gap-2 text-lg"><i class="ph-fill ph-star text-xl"></i> KHEN THƯỞNG</button>`;
            }

            const isDark = pickerBg !== 'default';
            const modalContent = `
                <div class="flex flex-col items-center p-10 bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-50 rounded-bl-full -mr-10 -mt-10 z-0 opacity-50"></div>
                    
                    ${getAvatarImg(winner.data.avatarUrl, winner.data.name, 'relative z-10 w-40 h-40 shadow-xl mb-6 ring-8 ring-slate-50 group-hover:scale-105 transition-transform')}
                    
                    <div class="relative z-10 text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">${pickTarget === 'student' ? 'HỌC SINH ĐƯỢC CHỌN' : 'TỔ ĐƯỢC CHỌN'}</div>
                    <div class="relative z-10 text-3xl md:text-4xl font-black text-slate-800 text-center leading-tight mb-2">${winner.data.name}</div>
                    
                    ${winner.data.group ? `<div class="relative z-10 text-sm font-bold text-blue-600 uppercase bg-blue-50 px-4 py-1.5 rounded-xl border border-blue-100">${winner.data.group}</div>` : ''}
                    
                    ${actionBtnHtml}
                </div>
            `;
            
            showRandomResultModal('', modalContent); // Dùng lại modal kết quả đã có
            
            // Resume background animation slowly
            pickerAnimationId = requestAnimationFrame(animatePicker);
        }
        
        function renderViewXepHang() {
            const sortedStudents = [...state.students].sort((a,b) => (b.points || 0) - (a.points || 0));
            let contentHtml = '';
            
            // Define rankingTab globally if not exists
            if(typeof rankingTab === 'undefined') window.rankingTab = 'bang-vang';

            if (rankingTab === 'bang-vang') {

        window.exportData = function() {
            const dataStr = JSON.stringify(state, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = `ChuyenTauThanhXuan_Backup_${getTodayString()}.json`;

            let linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            showToast("Đã tải xuống bản sao lưu!", "success");
        };

        window.importData = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (confirm("Cảnh báo: Dữ liệu hiện tại sẽ bị ghi đè hoàn toàn bởi dữ liệu từ file phục hồi. Bạn có chắc chắn muốn tiếp tục?")) {
                        state = { ...state, ...importedState };
                        applyStateDefaults();
                        saveData();
                        renderLayout();
                        showToast("Đã phục hồi dữ liệu thành công!", "success");
                    }
                } catch (error) {
                    showToast("File không hợp lệ hoặc bị lỗi!", "error");
                }
            };
            reader.readAsText(file);
            // Reset input so the same file can be selected again if needed
            event.target.value = '';
        };

        function saveStudentEdit() {
            const name = document.getElementById('edit-s-name').value.trim();
            if(!name) return showToast('Vui lòng nhập tên học sinh!', 'error');
            const sData = {
                name: name, 
                gender: document.getElementById('edit-s-gender').value, 
                group: document.getElementById('edit-s-group').value,
                role: document.getElementById('edit-s-role').value.trim(), 
                goal: document.getElementById('edit-s-goal').value.trim(),
                talent: document.getElementById('edit-s-talent').value.trim(),
                avatarUrl: document.getElementById('edit-s-avatar').value.trim(),
                dob: document.getElementById('edit-s-dob').value,
                boardingType: document.getElementById('edit-s-boarding').value
            };
            if (state.editingStudentId) {
                const index = state.students.findIndex(s => s.id === state.editingStudentId);
                if (index > -1) state.students[index] = { ...state.students[index], ...sData };
            } else {
                const newId = state.students.length > 0 ? Math.max(...state.students.map(s => s.id)) + 1 : 1;
                state.students.push({ id: newId, points: 0, stars: 0, code: generateUniqueCode(), history: [], ...sData });
            }
            saveData(); closeModal('edit-student-modal'); renderLayout(); showToast("Đã lưu thông tin học sinh!");
        }

        /* Logic implementations inherited, styled alerts removed in favor of showToast */
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas'); if (!canvas) return; const container = document.getElementById('main-container');
            canvas.width = container.offsetWidth; canvas.height = container.offsetHeight; const ctx = canvas.getContext('2d');
            const particles = [], colors = ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];
            for (let i = 0; i < 150; i++) particles.push({ x: canvas.width/2, y: canvas.height/2+50, r: Math.random()*6+2, dx: Math.random()*16-8, dy: Math.random()*-15-5, color: colors[Math.floor(Math.random()*colors.length)], tilt: Math.floor(Math.random()*10)-10, tiltAngleInc: (Math.random()*0.07)+0.05, tiltAngle: 0 });
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height); let active = 0;
                particles.forEach(p => { if (p.y < canvas.height) active++; p.tiltAngle += p.tiltAngleInc; p.y += (Math.cos(p.tiltAngle) + p.dy + p.r/2)/2; p.x += Math.sin(p.tiltAngle)*2 + p.dx; p.dy += 0.2; ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color; ctx.moveTo(p.x+p.tilt+p.r, p.y); ctx.lineTo(p.x+p.tilt, p.y+p.tilt+p.r); ctx.stroke(); });
                if (active > 0) requestAnimationFrame(render); else ctx.clearRect(0, 0, canvas.width, canvas.height);
            } render();
        }

        function renderDrawerTimerText() {
            const display = document.getElementById('drawer-timer-display');
            if (display) {
                const span = display.querySelector('span');
                const m = Math.floor(timerSeconds / 60), s = timerSeconds % 60; span.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

        function updateTimerFromInputs() {
            if (isTimerRunning) return; 
            let m = parseInt(document.getElementById('drawer-min-input').value)||0, s = parseInt(document.getElementById('drawer-sec-input').value)||0;
            if (s > 59) { m += Math.floor(s / 60); s = s % 60; } if (m > 99) m = 99;
            document.getElementById('drawer-min-input').value = m; document.getElementById('drawer-sec-input').value = s;

        function toggleDrawerTimer() {
            const startBtn = document.getElementById('drawer-start-btn');
            if (isTimerRunning) {
                clearInterval(timerInterval); isTimerRunning = false; startBtn.innerText = "Tiếp Tục";
            } else {
                if (timerSeconds <= 0) updateTimerFromInputs(); if (timerSeconds <= 0) return;
                isTimerRunning = true; startBtn.innerText = "Tạm Dừng";
                if (Tone.context.state !== 'running') Tone.start();
                let tickSynth = null;
                try { tickSynth = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination(); tickSynth.volume.value = -15; } catch(e) {}
                timerInterval = setInterval(() => {
                    timerSeconds--; renderDrawerTimerText();
                    if (tickSynth && Tone.context.state === 'running') {
                        if (timerSeconds <= 10 && timerSeconds > 0) tickSynth.triggerAttackRelease("E5", "8n");
                        else if (timerSeconds > 10) tickSynth.triggerAttackRelease("C5", "16n");
                    }
                    if (timerSeconds <= 0) {
                        clearInterval(timerInterval); isTimerRunning = false; startBtn.innerText = "Bắt Đầu"; showToast("Hết giờ!", "success");
                        try{ const s = new Tone.PolySynth().toDestination(); s.triggerAttackRelease(['C4','E4','G4'], "1n"); }catch(e){}
                    }
                }, 1000);
            }
        }

                { val: 'from-emerald-500 to-teal-800', label: 'Rừng xanh' }, 
                { val: 'from-orange-400 to-red-600', label: 'Hoàng hôn' }, 
                { val: 'from-fuchsia-600 to-purple-900', label: 'Ảo diệu' }, 
                { val: 'from-rose-400 to-pink-600', label: 'Ngọt ngào' }, 
                { val: 'from-cyan-400 to-blue-600', label: 'Bầu trời' } 
            ];

            const colorBtnsHtml = colors.map(c => `
                <button onclick="document.getElementById('edit-theme-color').value='${c.val}'; document.querySelectorAll('.banner-color-btn').forEach(b => b.classList.remove('ring-4', 'ring-white', 'shadow-lg', 'scale-110')); this.classList.add('ring-4', 'ring-white', 'shadow-lg', 'scale-110');" 
                        class="h-12 rounded-xl bg-gradient-to-br ${c.val} shadow-sm transition-all banner-color-btn ${currentColor === c.val ? 'ring-4 ring-white shadow-lg scale-110' : 'hover:scale-105 border border-slate-200'}"></button>
            `).join('');

            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="edit-theme-modal">
                    <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="bg-primary text-white p-6 flex justify-between items-center px-8 relative"><h3 class="font-black text-xl flex items-center gap-2 relative z-10"><i class="ph-fill ph-image text-accent"></i> GIAO DIỆN CHUNG</h3><button onclick="closeModal('edit-theme-modal')" class="bg-white/10 p-2.5 rounded-full hover:bg-white/20 transition-colors relative z-10"><i class="ph-bold ph-x text-lg"></i></button></div>
                        <div class="p-8 space-y-6 bg-slate-50 overflow-y-auto custom-scrollbar flex-1">
                            <div><label class="block text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Tiêu đề phụ (VD: Chủ điểm tháng)</label><input type="text" id="edit-theme-month" value="${escapeHtmlAttr(state.theme.month || '')}" class="w-full px-5 py-3.5 bg-white border border-slate-300 rounded-xl focus:border-blueAccent focus:ring-4 focus:ring-blue-100 font-bold transition-all text-sm outline-none"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Tiêu đề chính Banner</label><input type="text" id="edit-theme-title" value="${escapeHtmlAttr(state.theme.title || '')}" class="w-full px-5 py-3.5 bg-white border border-slate-300 rounded-xl focus:border-blueAccent focus:ring-4 focus:ring-blue-100 font-black text-slate-800 transition-all text-base outline-none"></div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-3 uppercase tracking-widest">Giao diện Màu nền</label>
                                <div class="grid grid-cols-4 sm:grid-cols-7 gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">${colorBtnsHtml}</div>
                                <input type="hidden" id="edit-theme-color" value="${currentColor}">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-3 uppercase tracking-widest">Hoặc dùng Ảnh nền (Tùy chọn)</label>
                                <div class="relative cursor-pointer group mb-2" onclick="document.getElementById('edit-theme-banner-upload').click()">
                                    <div id="banner-preview-container" class="w-full h-36 rounded-2xl bg-slate-100 flex items-center justify-center shadow-inner overflow-hidden border-2 border-dashed border-slate-300 group-hover:border-blueAccent transition-colors relative">
                                        ${state.theme.bannerUrl ? `<img src="${state.theme.bannerUrl}" class="w-full h-full object-cover">` : `<div class="flex flex-col items-center gap-2"><i class="ph-fill ph-image text-4xl text-slate-300"></i><span class="text-xs font-bold text-slate-400">Bấm để chọn ảnh</span></div>`}
                                    </div>
                                    <input type="file" id="edit-theme-banner-upload" class="hidden" accept="image/*" onchange="handleBannerUpload(event)">
                                </div>
                                <input type="text" id="edit-theme-banner" value="${escapeHtmlAttr(state.theme.bannerUrl || '')}" class="hidden">
                                ${state.theme.bannerUrl ? `<button onclick="document.getElementById('edit-theme-banner').value=''; document.getElementById('banner-preview-container').innerHTML='<div class=\\'flex flex-col items-center gap-2\\'><i class=\\'ph-fill ph-image text-4xl text-slate-300\\'></i><span class=\\'text-xs font-bold text-slate-400\\'>Bấm để chọn ảnh</span></div>'; this.style.display='none';" class="text-[11px] text-red-500 font-bold bg-red-50 px-3 py-1.5 rounded-lg border border-red-100">Xóa ảnh và dùng màu nền</button>` : ''}
                            </div>
                        </div>
                        <div class="p-6 bg-white border-t border-slate-200"><button onclick="saveThemeEdit()" class="w-full py-4 bg-primary text-white font-black rounded-xl hover:bg-secondary shadow-lg hover:-translate-y-0.5 transition-all tracking-wide">CẬP NHẬT GIAO DIỆN</button></div>
                    </div>
                </div>
            `;
        }

        function handleBannerUpload(e) {
            const file = e.target.files[0]; if (!file) return;
            compressImage(file, (dataUrl) => {
                document.getElementById('edit-theme-banner').value = dataUrl;
                const preview = document.getElementById('banner-preview-container');
                if (preview) preview.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover rounded-2xl"><div class="absolute inset-0 bg-black/50 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><i class="ph-bold ph-upload-simple text-white text-3xl mb-2"></i><span class="text-white text-sm font-bold">Thay ảnh khác</span></div>`;
            }, 1200, 0.8);
        }

        function saveThemeEdit() {
            state.theme.month = document.getElementById('edit-theme-month').value.trim();
            state.theme.title = document.getElementById('edit-theme-title').value.trim();
            state.theme.bannerUrl = document.getElementById('edit-theme-banner').value.trim();
            state.theme.bannerColorClass = document.getElementById('edit-theme-color').value.trim();
            saveData(); closeModal('edit-theme-modal'); renderLayout(); showToast("Đã cập nhật giao diện tổng quan!");
        }

        /* --- TÍNH NĂNG XEM LỊCH SỬ HỌC SINH --- */
        window.openStudentHistoryModal = function(id) {
            const student = state.students.find(s => s.id === id);
            if (!student) return;

            const history = student.history || [];
            // Sắp xếp lịch sử mới nhất lên đầu
            const sortedHistory = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));

            let historyHtml = '';
            if (sortedHistory.length === 0) {
                historyHtml = `
                    <div class="text-center py-12 flex flex-col items-center justify-center border-2 border-dashed border-slate-200 rounded-3xl bg-white/50">
                        <i class="ph-fill ph-clock-dashed text-6xl text-slate-300 mb-3"></i>
                        <div class="text-slate-500 font-bold text-lg">Chưa có dữ liệu</div>
                        <p class="text-sm text-slate-400 mt-1">Học sinh chưa có lịch sử cộng/trừ điểm nào.</p>
                    </div>`;
            } else {
                historyHtml = sortedHistory.map(h => {
                    const dateObj = new Date(h.date);
                    const dateStr = `${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${dateObj.getFullYear()}`;
                    const timeStr = `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
                    const isPositive = h.points > 0;
                    
                    const colorTheme = isPositive 
                        ? { bg: 'bg-emerald-50', text: 'text-emerald-600', border: 'border-emerald-200', icon: 'ph-trend-up', sign: '+' } 
                        : { bg: 'bg-red-50', text: 'text-red-600', border: 'border-red-200', icon: 'ph-trend-down', sign: '' };

                    return `
                        <div class="flex gap-5 items-start relative pb-6 group">
                            <!-- Đường viền dọc nối các sự kiện -->
                            <div class="absolute top-10 left-[23px] bottom-0 w-[2px] bg-slate-200 group-last:bg-transparent"></div>
                            
                            <!-- Icon -->
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0 z-10 shadow-sm border ${colorTheme.border} ${colorTheme.bg} ${colorTheme.text}">
                                <i class="ph-bold ${colorTheme.icon} text-xl"></i>
                            </div>
                            
                            <!-- Nội dung -->
                            <div class="flex-1 bg-white p-4 md:p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all hover:-translate-y-1">
                                <div class="flex justify-between items-start gap-4 mb-2">
                                    <div class="font-bold text-slate-800 text-base leading-tight">${h.reason}</div>
                                    <div class="font-black text-xl flex-shrink-0 ${colorTheme.text} bg-white px-2 py-0.5 rounded-lg border ${colorTheme.border} shadow-sm">${colorTheme.sign}${h.points}</div>
                                </div>
                                <div class="text-[11px] font-bold text-slate-400 flex items-center gap-1.5 uppercase tracking-wider">
                                    <i class="ph-fill ph-clock"></i> ${timeStr} <span class="mx-1">•</span> <i class="ph-fill ph-calendar-blank"></i> ${dateStr}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            const modalHtml = `
                <div class="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="history-student-modal">
                    <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="bg-primary text-white p-6 flex justify-between items-center px-8 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmYiLz48L3N2Zz4=')]"></div>
                            <h3 class="font-black text-xl flex items-center gap-3 relative z-10"><i class="ph-fill ph-clock-counter-clockwise text-accent text-2xl"></i> LỊCH SỬ THI ĐUA</h3>
                            <button onclick="closeModal('history-student-modal')" class="text-white hover:text-red-400 bg-white/10 hover:bg-white/20 p-2.5 rounded-full transition-colors relative z-10"><i class="ph-bold ph-x text-lg"></i></button>
                        </div>
                        
                        <!-- Header / Profile -->
                        <div class="px-8 py-6 border-b border-slate-200 bg-white flex items-center justify-between gap-4 shadow-sm z-10 relative">
                            <div class="flex items-center gap-5">
                                ${getAvatarImg(student.avatarUrl, student.name, "w-16 h-16 ring-4 ring-slate-50 shadow-md")}
                                <div>
                                    <div class="font-black text-slate-800 text-2xl tracking-tight mb-1">${student.name}</div>
                                    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest bg-slate-100 px-3 py-1 rounded-lg inline-block border border-slate-200">${student.group}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">TỔNG ĐIỂM HIỆN TẠI</div>
                                <div class="text-3xl font-black text-blueAccent">${student.points}</div>
                            </div>
                        </div>

                        <!-- Timeline -->
                        <div class="p-6 md:p-8 flex-1 overflow-y-auto custom-scrollbar bg-slate-50 relative">
                            ${historyHtml}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = modalHtml;
        };
window.exportToPDF = function() {
            const element = document.getElementById('report-container');
            if (!element) return showToast("Không tìm thấy nội dung báo cáo!", "error");
            
            // Đổi trạng thái nút bấm để báo hiệu đang xử lý
            const btn = document.getElementById('btn-export-pdf');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="ph-bold ph-spinner-gap animate-spin text-lg"></i> Đang tạo PDF...`;
            btn.disabled = true;
            btn.classList.add('opacity-70');

            // Cấu hình file PDF xuất ra (Nằm ngang, khổ A4, chất lượng nét)
            const opt = {
                margin:       10,
                filename:     `BaoCao_${state.admin.className || 'Lop'}_${getTodayString()}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            // Thực hiện xuất file
            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                showToast("Đã tải xuống file PDF thành công!", "success");
            }).catch(err => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                showToast("Lỗi khi tạo PDF, vui lòng thử lại!", "error");
                console.error(err);
            });
        };
    </script>
    <script src="./dashboard-gvcn.js"></script>
</body>
</html>
